name: CI

# Runs the unit suite and a production build, so a pass or fail is one short check to read
# instead of someone re-running the tests by hand
on:
  # Every push to any branch
  push:
    branches: ['**']
  # Manual run from the Actions tab
  workflow_dispatch:

# A newer push to the same ref cancels the older run so runs do not queue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      # Angular's incremental build cache, keyed on dependencies and config
      - uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ng-${{ runner.os }}-${{ hashFiles('package-lock.json', 'angular.json') }}-${{ github.sha }}
          restore-keys: |
            ng-${{ runner.os }}-${{ hashFiles('package-lock.json', 'angular.json') }}-

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npx ng build
