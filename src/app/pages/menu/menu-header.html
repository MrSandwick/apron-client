<!-- Header on solid golden sky, with the sun sinking below its bottom edge -->
<header
  data-header
  class="relative overflow-hidden bg-sky-golden px-6 pt-10 pb-20 text-center sm:pt-14 sm:pb-24"
>
  <!-- The home hero's clouds drifting behind the copy; the box parallaxes with scroll -->
  <div
    aria-hidden="true"
    data-parallax="0.15"
    class="pointer-events-none absolute inset-x-0 top-2 h-40 sm:h-44"
  >
    <app-sky-clouds class="size-full" />
  </div>

  <!-- Flat low sun, clipped by the horizon; outer box parallaxes, inner box rises on load -->
  <div
    aria-hidden="true"
    data-parallax="0.2"
    class="pointer-events-none absolute bottom-0 left-1/2 size-[170px] -translate-x-1/2 translate-y-[60%] sm:size-[240px]"
  >
    <div data-sun-rise class="relative size-full">
      <!-- Soft glow behind the disc -->
      <div
        data-sun-glow
        class="absolute -inset-1/4 rounded-full bg-[radial-gradient(circle,var(--color-sun)_0%,transparent_68%)] opacity-60"
      ></div>
      <div class="relative size-full rounded-full bg-sun-set"></div>
    </div>
  </div>
  <!-- Horizon line -->
  <div
    aria-hidden="true"
    class="pointer-events-none absolute inset-x-0 bottom-0 h-px bg-day-ink/25"
  ></div>

  <!-- Title copy, kept above the sun so small text stays on golden -->
  <div class="relative mx-auto max-w-[720px]">
    <p data-enter class="eyebrow text-day-ink">Ahjoomah's kitchen</p>
    <div data-enter class="mt-3">
      <h1 class="font-display text-[48px] leading-none text-day-ink sm:text-[64px]">The Menu</h1>
      <!-- Hand-drawn brush underline; pathLength 1 lets the draw-in tween run 1 to 0 -->
      <svg
        aria-hidden="true"
        viewBox="0 0 200 12"
        class="mx-auto mt-1 h-2.5 w-[170px] text-day-accent sm:w-[230px]"
        fill="none"
      >
        <path
          data-brush
          d="M4 7C30 3 52 10 84 6C112 2 140 9 170 5C182 4 190 5 196 6"
          pathLength="1"
          stroke="currentColor"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-dasharray="1"
          stroke-dashoffset="0"
        />
      </svg>
    </div>
    <!-- Korean "menu" as a red seal stamp -->
    <p data-enter class="mt-2">
      <span
        data-testid="menu-seal"
        class="inline-block -rotate-3 rounded-lg bg-tag-ember px-3 py-2 font-kr text-[20px] leading-none font-bold text-brand-cream outline-1 -outline-offset-[3px] outline-brand-cream/45 sm:text-[22px]"
        lang="ko"
      >
        메뉴
      </span>
    </p>
    <!-- Placeholder copy until the owner supplies her own wording -->
    <p
      data-enter
      class="mx-auto mt-2.5 max-w-[480px] font-sans text-[17px] leading-relaxed text-day-ink"
    >
      Home-style Korean cooking, made to share.
    </p>
  </div>
</header>
