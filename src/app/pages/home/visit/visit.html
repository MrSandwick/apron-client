<!-- Evening: the sun is down, so this is where "come tonight" info lives, right before Reserve -->
<section
  class="bg-linear-to-b from-sky-twilight to-sky-evening px-6 py-20 sm:py-28"
  data-testid="home-visit"
>
  <div class="mx-auto grid max-w-[1152px] gap-12 md:grid-cols-[1.4fr_1fr] md:gap-6">
    <!-- Find Us: one card per location -->
    <div appReveal>
      <p class="eyebrow">Tonight</p>
      <h2 class="mt-2 font-display text-[30px] text-night-text sm:text-[34px]">Find Us</h2>
      <div class="mt-6 grid gap-4 sm:grid-cols-[repeat(auto-fit,minmax(16rem,1fr))]">
        @for (loc of locations; track loc.city) {
          <div
            class="flex flex-col rounded-2xl border border-white/10 bg-white/5 p-6 transition-colors hover:border-brand-amber/40"
          >
            <div class="flex items-center gap-2">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" class="size-[18px] text-brand-amber">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
              </svg>
              <h3 class="font-display text-[19px] text-night-text">{{ loc.city }}</h3>
            </div>
            <p class="mt-3 font-kr text-[15px] leading-[1.6] text-night-text/75">{{ loc.address }}</p>
            <p class="font-kr text-[15px] text-night-text/75">{{ loc.phone }}</p>
            <!-- Placeholder: external map link not wired yet; padded to a 44px tap target -->
            <button
              type="button"
              class="-ml-2 mt-3 inline-flex min-h-11 items-center self-start rounded-full px-2 font-sans text-[14px] font-bold text-brand-amber hover:underline"
            >
              Get Directions →
            </button>
          </div>
        }
      </div>
    </div>

    <!-- Hours, with Ahjoomah peeking over the top edge of the card -->
    <div appReveal="120">
      <h2 class="font-display text-[30px] text-night-text md:mt-[26px] sm:text-[34px]">Hours</h2>
      <div class="relative mt-14">
        <app-ahjoomah-peek class="absolute right-6 bottom-full w-20 sm:w-24" />
        <dl class="relative rounded-2xl border border-white/10 bg-white/5 p-2">
          @for (row of hours; track row.label; let last = $last) {
            <div
              class="flex items-center justify-between gap-4 px-4 py-3.5"
              [class]="
                isToday(row.days)
                  ? 'rounded-xl bg-brand-amber/12'
                  : last
                    ? 'rounded-xl'
                    : 'border-b border-white/10'
              "
            >
              <dt class="flex items-center gap-2 font-kr text-[16px] font-medium text-night-text">
                {{ row.label }}
                @if (isToday(row.days)) {
                  <span class="rounded-full bg-brand-apron-deep px-2 py-0.5 font-sans text-[10px] font-bold uppercase tracking-[0.1em] text-brand-cream">
                    Today
                  </span>
                }
              </dt>
              <dd
                class="font-kr text-[14px]"
                [class]="isToday(row.days) ? 'font-bold text-brand-amber' : 'text-night-text/75'"
              >
                {{ row.time }}
              </dd>
            </div>
          }
        </dl>
      </div>
    </div>
  </div>
</section>
