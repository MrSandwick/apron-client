<!-- Evening: the sun is down, so this is where "come tonight" info lives, right before Reserve -->
<section
  #section
  class="relative overflow-hidden bg-linear-to-b from-sky-twilight to-sky-evening px-6 pt-32 pb-36"
  data-testid="home-visit"
>
  <!-- Giant outlined word drifting sideways with scroll, behind everything -->
  <div
    #drift
    aria-hidden="true"
    data-testid="visit-drift"
    class="pointer-events-none absolute top-[24px] left-0 font-display text-[length:clamp(110px,18vw,280px)] leading-none whitespace-nowrap text-transparent will-change-transform [-webkit-text-stroke:1px_rgb(245_230_200/0.16)]"
  >
    Find us · <span class="font-kr">찾아오세요</span> · Find us ·
    <span class="font-kr">찾아오세요</span> ·
  </div>

  <div class="relative mx-auto max-w-[1152px] text-center">
    <!-- Centered stack: heading, address and actions, then the hours in one quiet row -->
    <div appInView>
      <p
        class="eyebrow flex items-center justify-center gap-3 transition-[opacity,translate] duration-900 ease-print armed:translate-y-7 armed:opacity-0"
      >
        <span class="h-px w-8 bg-brand-amber/70" aria-hidden="true"></span>
        Tonight
        <span class="h-px w-8 bg-brand-amber/70" aria-hidden="true"></span>
      </p>
      <!-- Each heading line rises out of its own mask -->
      <h2
        class="mt-[18px] font-display text-[length:clamp(44px,6.4vw,76px)] leading-[0.95] font-normal tracking-[-0.01em] text-brand-cream"
      >
        <span class="block overflow-hidden pb-[0.06em]">
          <span class="block transition-transform duration-1000 ease-print armed:translate-y-[105%]"
            >Come find
          </span>
        </span>
        <span class="block overflow-hidden pb-[0.06em]">
          <span
            class="block text-brand-amber transition-transform duration-1000 ease-print [transition-delay:100ms] armed:translate-y-[105%]"
          >
            us tonight
          </span>
        </span>
      </h2>

      <!-- Only one location exists, in Chicago -->
      @let loc = locations[0];
      <p
        class="mt-8 font-sans text-[18px] leading-relaxed font-bold text-night-text/85 transition-[opacity,translate] duration-900 ease-print [transition-delay:150ms] armed:translate-y-7 armed:opacity-0"
      >
        <span class="font-display text-[22px] font-normal text-brand-cream">{{ loc.city }}</span>
        <span class="mx-2 text-night-text/40" aria-hidden="true">·</span>
        {{ loc.address }}
      </p>

      <!-- Placeholders until real map and phone links exist: aria-disabled says so, yet they stay
           visible and focusable; both keep a 44px tap target -->
      <div
        class="mt-7 flex flex-wrap justify-center gap-3 transition-[opacity,translate] duration-900 ease-print [transition-delay:250ms] armed:translate-y-7 armed:opacity-0"
      >
        <button type="button" aria-disabled="true" class="btn-primary min-h-11">
          Get Directions
        </button>
        <button type="button" aria-disabled="true" class="btn-ghost min-h-11">Call</button>
      </div>
    </div>

    <!-- Hours: settles into place with scroll; Ahjoomah peeks over the top edge -->
    <div #panel appInView class="relative mt-20 origin-top will-change-transform">
      <app-ahjoomah-peek class="absolute right-0 bottom-full hidden w-24 md:block" />

      <!-- One column per span of days, each under a hairline. Every column has the same box, so
           marking today (amber line and text, plus the tag) never shifts the layout -->
      <dl
        data-testid="hours-list"
        class="grid gap-x-12 gap-y-8 text-left font-sans font-bold md:grid-cols-3"
      >
        @for (row of hours; track row.label; let i = $index) {
          <div
            class="border-t-2 pt-5 transition-[opacity,translate] duration-700 ease-print armed:translate-y-6 armed:opacity-0"
            [class]="isToday(row.days) ? 'border-brand-amber' : 'border-white/[0.12]'"
            [style.transition-delay.ms]="50 + i * 100"
          >
            <dt
              class="flex items-center gap-2.5 text-[12px] tracking-[0.2em] uppercase"
              [class]="isToday(row.days) ? 'text-brand-amber' : 'text-night-text/60'"
            >
              {{ row.label }}
              @if (isToday(row.days)) {
                <span
                  class="rounded-full bg-brand-apron-deep px-2 py-[3px] text-[10px] leading-none tracking-[0.12em] text-brand-cream"
                >
                  Today
                </span>
              }
            </dt>
            <dd
              class="mt-3 font-display text-[clamp(22px,2.4vw,28px)] font-normal tabular-nums"
              [class]="isToday(row.days) ? 'text-brand-amber' : 'text-brand-cream'"
            >
              {{ row.time }}
            </dd>
          </div>
        }
      </dl>
    </div>
  </div>
</section>
