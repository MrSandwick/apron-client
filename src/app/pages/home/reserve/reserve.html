<!-- Evening into night, carrying on from the visit section into the night footer -->
<section class="relative overflow-hidden bg-linear-to-b from-sky-evening to-sky-night" data-testid="home-reserve">
  <!-- Frame the object + veils to the copy's max width so on ultra-wide screens the
       object stays inside the section instead of drifting to the viewport edge -->
  <div class="pointer-events-none absolute inset-0 mx-auto max-w-[1152px]">
    <!-- Soft warm pool of light under the object -->
    <div
      class="absolute top-1/2 right-0 hidden size-[560px] -translate-y-1/2 rounded-full md:block"
      style="background: radial-gradient(circle, rgba(240, 165, 0, 0.12) 0%, rgba(0, 0, 0, 0) 65%)"
    ></div>
    <!-- 3D green bottle (no label or brand) spanning the frame, pinned right beside the copy -->
    <!-- Colour mirrors the brand-bottle token (canvas inputs take hex, not utilities) and is used by the
         built-in fallback bottle. The model is a CC BY 4.0 soju bottle, credited in the footer -->
    <app-section-canvas
      class="absolute inset-0 block"
      variant="bottle"
      color="#2f8f4e"
      align="right"
      model="modelAssets/soju/scene.gltf"
    />
    <!-- Darken the copy side, clearing before the object so it stays bright. It repeats the
         section's own evening-to-night gradient and fades out sideways with a mask, so its edges
         match the background exactly instead of showing a seam at the frame's sides -->
    <div
      class="absolute inset-0 bg-linear-to-b from-sky-evening to-sky-night [mask-image:linear-gradient(to_right,black_25%,rgb(0_0_0/0.75)_48%,transparent_62%)]"
    ></div>
    <!-- On narrow screens the object sits under the copy, so dim it strongly (same gradient, no seam) -->
    <div class="absolute inset-0 bg-linear-to-b from-sky-evening/85 to-sky-night/85 md:hidden"></div>
  </div>

  <!-- Booking copy, feature list, and CTAs -->
  <div class="relative mx-auto max-w-[1152px] px-6 py-24 sm:py-32">
    <!-- Booking copy block rises in as the section scrolls into view -->
    <div appReveal class="flex max-w-[600px] flex-col gap-10">
      <div>
        <p class="eyebrow">Reservations</p>
        <h2 class="mt-3 font-display text-[40px] leading-[1.05] text-brand-cream sm:text-[56px]">
          Book Your<br />Table Online
        </h2>
        <p class="mt-5 font-kr text-[18px] leading-[1.7] text-brand-cream/70">
          Walk-ins welcome. Reservations guaranteed. Head to our dedicated booking page to choose
          your date, time, and party size — takes less than two minutes.
        </p>
        <!-- Optional Ahjoomah line -->
        <app-voice-bubble section="reserve" class="mt-6 block max-w-[320px] empty:hidden" />
      </div>

      <!-- Perks as a tidy two-column checklist -->
      <ul class="grid gap-3 sm:grid-cols-2">
        @for (feature of features; track feature) {
          <li
            class="flex items-center gap-3 rounded-xl border border-white/10 bg-white/5 px-4 py-3 backdrop-blur"
          >
            <span class="flex size-6 shrink-0 items-center justify-center rounded-full bg-brand-amber/15 text-brand-amber">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" class="size-3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
              </svg>
            </span>
            <span class="font-kr text-[15px] text-brand-cream/85">{{ feature }}</span>
          </li>
        }
      </ul>

      <div class="flex flex-wrap items-center gap-4">
        <a routerLink="/reserve" class="btn-primary">Reserve a Table →</a>
        <!-- Placeholder: phone number not wired yet -->
        <button type="button" class="btn-ghost">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z" />
          </svg>
          Or call us directly
        </button>
      </div>
    </div>
  </div>
</section>
