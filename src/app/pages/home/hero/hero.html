<!-- Dawn: the start of the page's day-to-night journey. Copy is kept to a minimum so the first
     look belongs to Ahjoomah rising over the rooftops of the parallax scene -->
<section
  #section
  class="world-day relative overflow-hidden bg-linear-to-b from-sky-dawn from-60% to-sky-noon"
  data-testid="home-hero"
>
  <!-- Parallax dawn scene, with Ahjoomah on its stage between the skyline and the rooftops -->
  <app-hero-scene>
    <!-- She rises from behind the rooftop wall like it's her counter: centred at the bottom on
         phones, large on the right from md up. Sized by screen height too, so on short phones
         she never runs into the buttons above. The frame clips on the bottom edge only (the negative
         insets leave the top and sides open, so a hop or squash never chops her head). On phones
         it ends just below her rolling pin, with that edge tucked behind the rooftop wall; from md
         up it covers her whole figure and the rooftops hide her lower half. min-h-0 keeps the
         phone frame at its aspect ratio instead of growing to fit her. On phones the tap is her
         main interaction -->
    <button
      type="button"
      class="pointer-events-auto absolute bottom-[calc(7%_-_6px)] left-1/2 md:bottom-[calc(7%_-_24px)] w-[min(70vw,calc(100svh_-_440px),290px)] -translate-x-1/2 cursor-pointer rounded-t-[40%] md:right-[6%] md:left-auto md:w-[min(40vw,calc(83svh_-_250px),350px)] md:translate-x-0 lg:right-[5%] lg:w-[min(33vw,calc(83svh_-_190px),400px)]"
      aria-label="Say hi to Ahjoomah"
      (click)="tap()"
      data-testid="hero-mascot"
    >
      <span class="block aspect-[200/202] min-h-0 md:aspect-auto [clip-path:inset(-60%_-20%_0_-20%)]">
        <app-ahjoomah #mascot class="block" [mood]="mood()" [decorative]="true" />
      </span>
    </button>
  </app-hero-scene>

  <!-- Copy column. Clicks pass through the empty part of the hero to Ahjoomah below -->
  <div
    #content
    class="pointer-events-none relative mx-auto flex min-h-[calc(100svh-4rem)] max-w-[1280px] origin-top flex-col justify-start px-6 pt-[9svh] pb-24 will-change-transform md:pt-[12svh]"
  >
    <div class="pointer-events-auto max-w-[680px]">
      <p data-intro="eyebrow" class="eyebrow flex items-center gap-3 text-day-accent">
        <span class="h-px w-8 bg-day-accent/70" aria-hidden="true"></span>
        Korean Kitchen<span class="hidden sm:inline"> · Chicago</span>
      </p>

      <h1
        data-intro="title"
        class="mt-5 font-display text-[42px] leading-[0.95] tracking-[-0.01em] text-day-ink min-[360px]:text-[46px] sm:text-[76px] lg:text-[104px]"
      >
        <span class="block">Ahjoomah's </span>
        <span class="block text-brand-apron-deep">Apron</span>
      </h1>

      <div data-intro="ctas" class="mt-8 flex flex-wrap items-center gap-3 sm:mt-10 sm:gap-4">
        <!-- Hovering or focusing Reserve makes Ahjoomah close her eyes happily and squish -->
        <a
          #reserveCta
          routerLink="/reserve"
          class="btn-primary"
          (mouseenter)="cheer(true)"
          (mouseleave)="cheer(false)"
          (focus)="cheer(true)"
          (blur)="cheer(false)"
          >Reserve a Table</a
        >
        <a
          routerLink="/menu"
          class="btn-ghost border-day-ink/25 bg-white/30 text-day-ink backdrop-blur hover:border-day-ink/50 hover:bg-white/50"
        >
          View Menu →
        </a>
      </div>
    </div>
  </div>

  <!-- Opt-in sound (off until the visitor turns it on) -->
  <app-sound-toggle class="absolute right-5 bottom-6 z-10 sm:right-8" />
</section>
