<!-- Radio group: the legend names it for screen readers -->
<fieldset class="min-w-0">
  <legend class="mb-3 font-sans text-[16px] font-bold text-day-ink">
    How would you like your order?
  </legend>

  <!-- Segmented control: two equal pills in one rounded track -->
  <div class="relative grid grid-cols-2 gap-1 rounded-full bg-day-ink/10 p-1">
    <!-- Sliding fill behind the pills; moves to the second pill for delivery -->
    <span
      aria-hidden="true"
      class="absolute inset-y-1 left-1 w-[calc(50%-0.375rem)] rounded-full bg-day-ink transition-transform duration-300 ease-spring motion-reduce:transition-none"
      [class]="mode() === 'delivery' ? 'translate-x-[calc(100%+0.25rem)]' : ''"
      data-testid="fulfillment-indicator"
    ></span>

    @for (option of options; track option.value) {
      <label
        class="relative block cursor-pointer transition motion-safe:active:scale-95 motion-reduce:transition-none"
      >
        <!-- Native radio, visually hidden but still focusable and arrow-key navigable -->
        <input
          type="radio"
          name="fulfillment"
          class="peer sr-only"
          [value]="option.value"
          [checked]="mode() === option.value"
          (change)="mode.set(option.value)"
        />
        <!-- Pill face: light text on the sliding fill when checked, ink ring when focused by keyboard -->
        <span
          class="relative z-10 flex min-h-11 items-center justify-center rounded-full px-5 font-display text-[17px] text-day-ink transition-colors duration-150 peer-checked:text-dusk-card peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-day-ink motion-reduce:transition-none"
        >
          {{ option.label }}
        </span>
      </label>
    }
  </div>
</fieldset>
