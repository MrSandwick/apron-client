<!-- Promo form: Enter in the input also applies -->
<form (submit)="apply($event)" novalidate>
  <label [for]="inputId" class="mb-2 block font-sans text-[16px] font-bold text-day-ink">
    Promo code
  </label>

  <!-- Input and Apply button side by side -->
  <div class="flex gap-2">
    <input
      [id]="inputId"
      type="text"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      class="min-h-11 min-w-0 flex-1 rounded-full border border-day-ink/30 bg-white/60 px-4 font-sans text-[16px] text-day-ink focus-visible:outline-day-ink"
      [attr.aria-describedby]="statusId"
      [value]="code()"
      (input)="onInput($event)"
    />
    <button
      type="submit"
      class="min-h-11 cursor-pointer rounded-full bg-day-ink px-6 font-display text-[17px] text-dusk-card transition-colors duration-150 hover:bg-day-ink-soft focus-visible:outline-day-ink motion-reduce:transition-none"
    >
      Apply
    </button>
  </div>

  <!-- Polite live region; always in the DOM so screen readers announce the text when it appears -->
  <p
    [id]="statusId"
    role="status"
    aria-live="polite"
    class="mt-2 min-h-6 font-sans text-[15px] text-day-ink-soft"
  >
    {{ message() }}
  </p>
</form>
