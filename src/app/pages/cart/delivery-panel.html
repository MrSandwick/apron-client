<!-- Delivery hand-off: explanation, then the external link -->
<div class="flex flex-col items-start gap-4">
  <p class="font-sans text-[16px] leading-relaxed text-day-ink">
    Uber Eats has its own menu, so your items here are not sent over. Your takeout cart is saved
    here.
  </p>

  <!-- Opens Uber Eats in a new tab -->
  <a
    [href]="deliveryUrl"
    target="_blank"
    rel="noopener noreferrer"
    class="inline-flex min-h-11 items-center justify-center gap-2 rounded-full bg-day-ink px-7 font-display text-[17px] text-dusk-card transition duration-150 motion-safe:active:scale-95 hover:bg-day-ink-soft focus-visible:outline-day-ink motion-reduce:transition-none"
  >
    Order delivery on Uber Eats
    <svg
      aria-hidden="true"
      viewBox="0 0 24 24"
      class="size-4 shrink-0"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M14 4h6v6" />
      <path d="M20 4l-9 9" />
      <path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
    </svg>
    <span class="sr-only">(opens in a new tab)</span>
  </a>
</div>
