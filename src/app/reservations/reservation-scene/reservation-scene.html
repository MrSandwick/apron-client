<!-- Korean soju-house dining room behind the booking card. Four [data-layer]s, far to near: soft bokeh,
     an out-of-focus room of lamp-lit tables, brass pendant lights, and the walnut table in front
     with the RESERVED card, a rice bowl, a stew pot and soju. Each layer drifts with
     the scroll and the cursor by its data-depth; its [data-intro] child and the pieces inside it
     pop in on entry. Without motion everything stays drawn and lit -->
<div class="relative size-full bg-linear-to-b from-dine-shadow via-dine-wall to-dine-wall">
  <!-- Shared gradients for the lights and the card face -->
  <svg class="absolute size-0" aria-hidden="true">
    <defs>
      <radialGradient id="rs-bokeh-amber">
        <stop offset="0%" class="[stop-color:var(--color-brand-amber)] [stop-opacity:0.25]" />
        <stop offset="80%" class="[stop-color:var(--color-brand-amber)] [stop-opacity:0.3]" />
        <stop offset="93%" class="[stop-color:var(--color-dine-flame)] [stop-opacity:0.36]" />
        <stop offset="100%" class="[stop-color:var(--color-brand-amber)] [stop-opacity:0]" />
      </radialGradient>
      <radialGradient id="rs-bokeh-cream">
        <stop offset="0%" class="[stop-color:var(--color-dine-flame)] [stop-opacity:0.2]" />
        <stop offset="80%" class="[stop-color:var(--color-dine-flame)] [stop-opacity:0.32]" />
        <stop offset="100%" class="[stop-color:var(--color-dine-flame)] [stop-opacity:0]" />
      </radialGradient>
      <radialGradient id="rs-warm-glow">
        <stop offset="0%" class="[stop-color:var(--color-dine-flame)] [stop-opacity:0.55]" />
        <stop offset="35%" class="[stop-color:var(--color-brand-amber)] [stop-opacity:0.18]" />
        <stop offset="100%" class="[stop-color:var(--color-brand-amber)] [stop-opacity:0]" />
      </radialGradient>
      <linearGradient id="rs-card-face" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" class="[stop-color:var(--color-brand-cream)]" />
        <stop offset="100%" class="[stop-color:var(--color-dine-paper-shade)]" />
      </linearGradient>
    </defs>
  </svg>

  <!-- Far layer: out-of-focus lights across the room -->
  <div data-layer="bokeh" data-depth="0" class="absolute -inset-[10%]">
    <div data-intro class="size-full">
      <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" class="size-full overflow-visible blur-[3px]">
        @for (disc of bokeh; track $index) {
          <g data-bokeh>
            <circle
              [attr.cx]="disc.x"
              [attr.cy]="disc.y"
              [attr.r]="disc.r"
              [attr.fill]="disc.warm ? 'url(#rs-bokeh-amber)' : 'url(#rs-bokeh-cream)'"
            />
          </g>
        }
      </svg>
    </div>
  </div>

  <!-- Back of the room, blurred: a banquette with small lamp-lit tables, sitting just behind the table -->
  <div
    data-layer="room"
    data-depth="0.15"
    class="absolute -inset-x-[6%] bottom-[150px] h-[220px] sm:bottom-[190px] lg:bottom-[clamp(250px,calc(38vh-40px),380px)] lg:h-[clamp(260px,36vh,380px)]"
  >
    <div data-intro class="size-full">
      <svg viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice" class="size-full overflow-visible blur-[5px]">
        <!-- Banquette running along the back wall -->
        <rect x="-40" y="150" width="1680" height="170" rx="18" class="fill-dine-shadow/80" />
        <rect x="-40" y="150" width="1680" height="6" rx="3" class="fill-brand-apron/25" />
        @for (t of roomTables; track t) {
          <!-- Lamp glow, shade and white tablecloth of a distant table -->
          <circle [attr.cx]="t" cy="168" r="80" fill="url(#rs-warm-glow)" />
          <path [attr.d]="'M' + (t - 14) + ' 176h28l-6 -20h-16z'" class="fill-brand-apron/70" />
          <rect [attr.x]="t - 75" y="196" width="150" height="60" rx="6" class="fill-brand-cream/18" />
        }
      </svg>
    </div>
  </div>

  <!-- Brass pendant lights hanging from the ceiling, each throwing a pool of light on the wall -->
  <div data-layer="pendants" data-depth="0.35" class="absolute -inset-x-[4%] top-0 h-[60%]">
    <div data-intro class="size-full">
      @for (p of pendants; track p.cls) {
        <div data-pendant [class]="'absolute ' + p.cls">
          <svg viewBox="0 0 120 400" class="w-full overflow-visible">
            <g data-sway>
              <!-- Light on the wall -->
              <circle data-pendant-glow cx="60" cy="300" r="150" fill="url(#rs-warm-glow)" />
              <!-- Cord, long enough to stay hidden above the top edge while the layer moves -->
              <path d="M60 -400V252" class="stroke-brand-cream/25" stroke-width="1.5" />
              <!-- Brass dome shade with a lit rim and the bulb under it -->
              <path d="M28 292Q28 254 60 250Q92 254 92 292Z" class="fill-dine-brass" />
              <path d="M60 250Q76 254 84 270" class="fill-none stroke-dine-flame/40" stroke-width="2" />
              <ellipse cx="60" cy="292" rx="32" ry="5" class="fill-dine-flame/80" />
              <circle cx="60" cy="300" r="9" class="fill-dine-flame" />
              <circle cx="60" cy="300" r="4" class="fill-white" />
            </g>
          </svg>
        </div>
      }
    </div>
  </div>

  <!-- Near layer: a walnut table seen from slightly above. The planks run toward a vanishing point
       above the back edge, the front edge shows the table's thickness, and the place settings sit
       at three depths: small and high at the back, larger and lower toward the viewer -->
  <div
    data-layer="table"
    data-depth="1"
    data-pointer-x-only
    class="absolute -inset-x-[60px] bottom-0 h-[190px] sm:h-[230px] lg:h-[clamp(290px,38vh,420px)]"
  >
    <div data-intro class="relative size-full">
      <!-- Night-coloured skirt below the table, so moving the layer never shows the room behind it -->
      <div class="absolute inset-x-0 top-full h-28 bg-linear-to-b from-black/70 to-sky-night"></div>

      <!-- Tabletop: walnut that darkens toward the viewer, with planks converging on the back -->
      <div class="absolute inset-x-0 top-0 h-[calc(100%-14px)] bg-linear-to-b from-dine-walnut to-dine-walnut-dark"></div>
      <svg viewBox="0 0 1600 300" preserveAspectRatio="none" class="absolute inset-x-0 top-0 h-[calc(100%-14px)] w-full">
        @for (x of planks; track x) {
          <path [attr.d]="'M800 -700L' + x + ' 300'" class="fill-none stroke-black/22" stroke-width="3" />
        }
      </svg>
      <!-- Light from the lanterns catching the back of the tabletop, fading toward the viewer -->
      <div class="absolute inset-x-0 top-0 h-[40%] bg-linear-to-b from-brand-amber/22 to-transparent"></div>
      <div class="absolute inset-x-0 top-0 h-[3px] bg-brand-amber/45"></div>

      <!-- Front edge: the thickness of the table -->
      <div class="absolute inset-x-0 bottom-0 h-[14px] border-t border-dine-flame/25 bg-dine-walnut"></div>

      <!-- Lantern light pooling on the wood under the right-hand setting -->
      <div data-pool class="absolute top-0 right-[6%] h-[80%] w-[44%]">
        <div
          data-glow
          class="size-full bg-[radial-gradient(ellipse_at_45%_40%,rgb(255_207_122/0.3),transparent_65%)]"
        ></div>
      </div>

      <!-- Left setting: a wrapper the same size as the SVG pieces, so the CSS card and the SVG items
           share one coordinate box. The RESERVED card is a real 3D tent in CSS (see below) -->
      <div class="absolute bottom-[calc(14px+24px)] lg:bottom-[calc(14px+40px)] left-[calc(3%+60px)] w-[50vw] max-w-[520px] sm:w-[52vw] lg:left-[calc(1%+68px)] lg:w-[min(36vw,680px)] lg:max-w-none aspect-[520/320]">
        <svg viewBox="0 0 520 320" class="absolute inset-0 size-full overflow-visible">
        <!-- Kimchi on a small plate, at the back -->
        <g transform="translate(424 232) scale(0.75)">
          <g data-prop data-order="3" class="opacity-90">
            <ellipse data-shadow cx="10" cy="9" rx="56" ry="11" class="fill-black/40 blur-[2px]" />
            <ellipse cx="0" cy="0" rx="52" ry="13" class="fill-dusk-card" />
            <ellipse cx="0" cy="-2" rx="42" ry="9" class="fill-brand-cream" />
            <path d="M-30 -3q8-14 20-8q8-10 22-2q12-6 20 6q-10 10-26 8q-20 6-36-4z" class="fill-brand-chili" />
            <path d="M-18 -8l6 4M-2 -10l6 5M14 -8l6 4" class="stroke-brand-apron-deep" stroke-width="2" stroke-linecap="round" />
            <circle cx="-8" cy="-9" r="1.4" class="fill-brand-cream" />
            <circle cx="10" cy="-11" r="1.4" class="fill-brand-cream" />
          </g>
        </g>
        <!-- Steel water cup behind the card's right shoulder: tapered body, bright rim, cool highlights -->
        <g transform="translate(338 246) scale(1.2)">
          <g data-prop data-order="2" class="opacity-95">
            <ellipse data-shadow cx="8" cy="2" rx="32" ry="5" class="fill-black/45 blur-[3px]" />
            <path d="M-22 0L-25 -96H25L22 0Z" class="fill-sky-dawn" />
            <path d="M-25 -96H25L24 -84H-24Z" class="fill-white/45" />
            <path d="M-17 -86L-14 -6" class="stroke-white/70" stroke-width="4" stroke-linecap="round" />
            <path d="M13 -86L11 -6" class="stroke-black/25" stroke-width="6" stroke-linecap="round" />
            <ellipse cx="0" cy="-96" rx="25" ry="5" class="fill-sky-dawn" />
            <ellipse cx="0" cy="-96" rx="20" ry="3.4" class="fill-dine-shadow/75" />
          </g>
        </g>
        <!-- Steel chopsticks and a long spoon lying at an angle in front, with their shadows -->
        <g data-prop data-order="7" data-slide>
          <g transform="translate(40 -4)">
            <path d="M332 306L452 272M342 312L462 278" class="stroke-sky-dawn" stroke-width="4.5" stroke-linecap="round" />
            <path d="M334 304L448 271" class="stroke-white/50" stroke-width="1.5" stroke-linecap="round" />
            <path d="M330 338L470 306" class="stroke-sky-dawn" stroke-width="4" stroke-linecap="round" />
            <ellipse cx="318" cy="340" rx="13" ry="7" transform="rotate(-18 318 340)" class="fill-sky-dawn" />
            <ellipse cx="318" cy="340" rx="8" ry="4" transform="rotate(-18 318 340)" class="fill-white/45" />
          </g>
        </g>
      </svg>
        <!-- RESERVED tent card, a CSS 3D tent: two panels meet at a top ridge and lean apart like an
             open book. The whole tent is turned so its right side recedes and the back panel shows as a
             dark wedge on the left. The front panel carries the text and follows the perspective -->
        <div
          data-prop
          data-order="5"
          class="absolute [perspective:1000px]"
          style="left: 9%; bottom: 4%; width: 46%; height: 50%"
        >
          <div data-shadow class="absolute -bottom-[4%] left-[-2%] h-[16%] w-[104%] bg-[radial-gradient(ellipse_at_46%_30%,rgb(0_0_0/0.42),transparent_68%)]"></div>
          <div class="absolute inset-0 transform-3d" style="transform: rotateX(-6deg) rotateY(36deg)">
            <!-- Back panel, leaning away from the viewer: only its edge and shadow side show -->
            <div
              class="absolute inset-x-0 top-0 h-full origin-top rounded-[3px] bg-dine-paper-shade"
              style="transform: rotateX(-22deg)"
            ></div>
            <!-- Front panel, leaning toward the viewer from the same ridge -->
            <div
              class="absolute inset-x-0 top-0 h-full origin-top overflow-hidden rounded-[3px] bg-[linear-gradient(to_bottom,var(--color-brand-cream),var(--color-dine-paper-shade))] shadow-lg"
              style="transform: rotateX(22deg)"
            >
              <div class="absolute inset-x-0 top-0 h-[3px] bg-white/80"></div>
              <div class="absolute inset-[9%] border border-sky-evening/35"></div>
              <div class="absolute inset-0 flex flex-col items-center justify-center gap-[4%] text-sky-evening">
                <p class="font-sans text-[clamp(10px,2.9vw,21px)] font-bold tracking-[0.14em]">RESERVED</p>
                <div class="flex items-center gap-[3%]">
                  <span class="h-[2px] w-[18%] bg-brand-amber"></span>
                  <span class="size-[0.6em] rotate-45 bg-brand-amber"></span>
                  <span class="h-[2px] w-[18%] bg-brand-amber"></span>
                </div>
                <p class="font-kr text-[clamp(8px,2.3vw,16px)] font-bold tracking-[0.25em] text-sky-evening/80">예약석</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right setting: a tall soju bottle at the back, the stew pot in the middle, a side dish
           and two glasses in front. The essentials sit at the outer end, clear of the booking card -->
      <svg
        viewBox="0 0 520 320"
        class="absolute right-[calc(3%+60px)] bottom-[calc(14px+24px)] lg:bottom-[calc(14px+40px)] w-[50vw] max-w-[520px] overflow-visible sm:w-[52vw] lg:right-[calc(2%+60px)] lg:w-[min(36vw,680px)] lg:max-w-none"
      >
        <!-- Warm light from the pot, behind everything else in the setting -->
        <g data-stew-glow>
          <g data-glow>
            <circle cx="320" cy="220" r="240" fill="url(#rs-warm-glow)" />
          </g>
        </g>
        <!-- Soju bottle at the back, tall: green glass, cream label with a red seal, no lettering -->
        <g transform="translate(436 240) scale(2.8)">
          <g data-prop data-order="1" class="opacity-95">
            <ellipse data-shadow cx="4" cy="1" rx="14" ry="2.5" class="fill-black/40 blur-[1.5px]" />
            <path d="M-11 0V-44q0-7 6-11v-19h10v19q6 4 6 11V0z" class="fill-brand-bottle" />
            <rect x="-6" y="-80" width="12" height="6" rx="1.5" class="fill-brand-leaf" />
            <path d="M-8.4 -46q1-4 3-6" class="fill-none stroke-white/40" stroke-width="1.5" stroke-linecap="round" />
            <path d="M-8 -6V-40" class="stroke-white/20" stroke-width="2" stroke-linecap="round" />
            <rect x="-6" y="-35" width="12" height="22" rx="1.5" class="fill-brand-cream" />
            <circle cx="0" cy="-24" r="3" class="fill-brand-apron" />
            <path d="M-3.5 -17h7M-3.5 -31h7" class="stroke-brand-muted" stroke-width="1" />
          </g>
        </g>
        <!-- Stone pot of stew in the middle: wide rim, red broth with tofu and scallion, steam -->
        <g transform="translate(286 298) scale(1.55) translate(-200 -262)">
          <g data-prop data-order="4">
            <ellipse data-shadow cx="212" cy="268" rx="78" ry="9" class="fill-black/40 blur-[3px]" />
            <rect x="128" y="204" width="14" height="10" rx="3" class="fill-dine-shadow" />
            <rect x="258" y="204" width="14" height="10" rx="3" class="fill-dine-shadow" />
            <path d="M136 200h128q2 46-30 62q-34 10-68 0q-32-16-30-62z" class="fill-dine-shadow" />
            <path d="M146 214Q150 244 172 256" class="fill-none stroke-white/15" stroke-width="3" stroke-linecap="round" />
            <ellipse cx="200" cy="200" rx="66" ry="11" class="fill-dine-walnut-dark" />
            <ellipse cx="200" cy="200" rx="58" ry="8" class="fill-brand-chili" />
            <rect x="176" y="194" width="16" height="9" rx="2" class="fill-brand-cream/90" />
            <rect x="206" y="197" width="14" height="8" rx="2" class="fill-brand-cream/90" />
            <path d="M160 200h10M228 201h12M196 204h8" class="stroke-brand-leaf" stroke-width="3" stroke-linecap="round" />
            <g class="fill-none stroke-brand-cream/55" stroke-width="4" stroke-linecap="round">
              <path data-steam d="M172 188c-9-14 9-24 0-40" />
              <path data-steam d="M200 186c-9-14 9-24 0-40" />
              <path data-steam d="M228 188c-9-14 9-24 0-40" />
            </g>
          </g>
        </g>
        <!-- Spinach side dish at the inner end, in front -->
        <g transform="translate(196 306) scale(1.3)">
          <g data-prop data-order="6">
            <ellipse data-shadow cx="10" cy="10" rx="58" ry="12" class="fill-black/40 blur-[2px]" />
            <ellipse cx="0" cy="0" rx="54" ry="14" class="fill-dusk-card" />
            <ellipse cx="0" cy="-2" rx="44" ry="10" class="fill-brand-cream" />
            <path d="M-32 -2q6-18 22-12q8-12 22-4q14-4 20 10q-8 10-24 8q-22 6-40-2z" class="fill-brand-leaf" />
            <path d="M-20 -8l8 4M-2 -12l6 6M12 -8l8 4" class="stroke-tag-leaf" stroke-width="2" stroke-linecap="round" />
            <circle cx="-6" cy="-12" r="1.4" class="fill-brand-cream" />
            <circle cx="14" cy="-10" r="1.4" class="fill-brand-cream" />
          </g>
        </g>
        @for (glass of glasses; track glass) {
          <!-- Small soju glass at the front, tapered, with a little clear soju in it -->
          <g [attr.transform]="glass">
            <g data-prop data-order="8">
              <ellipse data-shadow cx="6" cy="1" rx="22" ry="4" class="fill-black/40 blur-[2px]" />
              <path d="M-17 0L-21 -50H21L17 0Z" class="fill-white/12 stroke-brand-cream/50" stroke-width="2" />
              <path d="M-18 -18H18L17 0H-17Z" class="fill-white/35" />
              <path d="M-14 -44L-12 -10" class="stroke-white/45" stroke-width="3" stroke-linecap="round" />
            </g>
          </g>
        }
      </svg>
    </div>
  </div>

  <!-- Soft vignette so the edges fall into shadow and the card stays the focus -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_50%_40%,transparent_55%,rgb(0_0_0/0.45))]"></div>
</div>
